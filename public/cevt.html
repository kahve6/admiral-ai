<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CEvT — Client Event Tracking</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%230d9488'/><text x='16' y='23' font-size='16' font-family='sans-serif' font-weight='800' fill='white' text-anchor='middle'>C</text></svg>" />
  <link rel="stylesheet" href="assets/style.css?v=5" />
  <style>
    .cevt-logo-mark { background: linear-gradient(135deg, var(--cevt), var(--cevt-dark)) !important; }

    .cevt-layout { display: grid; grid-template-columns: 300px 1fr; gap: 0; height: calc(100vh - 57px); }
    @media (max-width: 780px) { .cevt-layout { grid-template-columns: 1fr; height: auto; } }

    .cevt-sidebar { border-right: 1px solid var(--border); background: var(--card); overflow-y: auto; }
    .cevt-sidebar-head { padding: 16px 18px 12px; border-bottom: 1px solid var(--border); }
    .cevt-sidebar-head h2 { margin: 0; font-size: 14.5px; font-weight: 750; }
    .cevt-sidebar-head p { margin: 4px 0 0; font-size: 12px; color: var(--dim-2); }

    .cevt-client-item {
      display: flex; flex-direction: column; gap: 3px; padding: 12px 18px; cursor: pointer;
      border-bottom: 1px solid var(--border); transition: background .12s;
    }
    .cevt-client-item:hover { background: var(--cevt-soft); }
    .cevt-client-item.active { background: var(--cevt-soft); box-shadow: inset 3px 0 0 var(--cevt); }
    .cevt-client-item .row1 { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .cevt-client-id { font-family: ui-monospace, monospace; font-size: 12px; font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .cevt-client-badge {
      font-size: 10.5px; font-weight: 700; color: var(--cevt-dark); background: #fff;
      border: 1px solid #99f0e0; border-radius: 20px; padding: 1px 8px; flex-shrink: 0;
    }
    .cevt-client-meta { font-size: 11px; color: var(--dim-2); display: flex; gap: 8px; flex-wrap: wrap; }
    .cevt-client-user { color: var(--cevt-dark); font-weight: 600; }

    .cevt-empty-sidebar { padding: 40px 18px; text-align: center; color: var(--dim-2); font-size: 13px; line-height: 1.6; }

    .cevt-main { overflow-y: auto; padding: 24px 28px; }
    .cevt-main-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 18px; flex-wrap: wrap; }
    .cevt-main-head h2 { margin: 0; font-size: 16px; font-weight: 750; font-family: ui-monospace, monospace; }
    .cevt-main-head .sub { font-size: 12.5px; color: var(--dim); }

    .cevt-timeline { display: flex; flex-direction: column; }
    .cevt-tl-item { display: flex; gap: 14px; position: relative; padding-bottom: 18px; }
    .cevt-tl-item:not(:last-child)::before {
      content: ''; position: absolute; left: 5px; top: 16px; bottom: 0; width: 1px; background: var(--border);
    }
    .cevt-tl-dot {
      width: 11px; height: 11px; border-radius: 50%; background: var(--cevt); border: 2px solid var(--cevt-soft);
      flex-shrink: 0; margin-top: 3px;
    }
    .cevt-tl-dot.server { background: #7c3aed; border-color: #ede9fe; }
    .cevt-tl-body { flex: 1; }
    .cevt-tl-name { font-size: 13.5px; font-weight: 700; color: var(--text); }
    .cevt-tl-source {
      font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em;
      color: var(--dim-2); margin-left: 6px;
    }
    .cevt-tl-time { font-size: 11.5px; color: var(--dim-2); margin-top: 2px; }
    .cevt-tl-extra { font-size: 12px; color: var(--dim); margin-top: 4px; }
    .cevt-tl-extra code { font-size: 11px; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 4px 8px; display: inline-block; margin-top: 2px; }

    .cevt-placeholder { text-align: center; padding: 80px 24px; color: var(--dim-2); }
    .cevt-placeholder .ic { font-size: 34px; margin-bottom: 10px; }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="topbar-left">
      <a class="logo" href="cevt.html">
        <span class="logo-mark cevt-logo-mark">C</span><span>CEvT</span>
      </a>
      <nav class="main-nav">
        <a class="nav-link active" href="cevt.html">📡 Genel Bakış</a>
        <a class="nav-link" href="app.html" target="_blank" rel="noopener">📊 ADMIRA'ya Git ↗</a>
      </nav>
    </div>
    <div class="user-chip">
      <div>
        <div class="user-name" id="userName" style="text-align:right">Misafir</div>
        <div class="user-meta" id="userEmail">admira</div>
      </div>
      <div class="avatar" id="userAvatar">C</div>
      <button class="btn btn-ghost btn-sm" id="btnLogout">Çıkış Yap</button>
    </div>
  </div>

  <div class="cevt-layout">
    <div class="cevt-sidebar">
      <div class="cevt-sidebar-head">
        <h2>Client'lar</h2>
        <p id="clientCount">Yükleniyor…</p>
      </div>
      <div id="clientList"></div>
    </div>
    <div class="cevt-main" id="mainPanel">
      <div class="cevt-placeholder">
        <div class="ic">🧭</div>
        <div>Soldan bir Client ID seç, olay geçmişini burada gör.</div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    (function () {
      function el(sel) { return document.querySelector(sel); }

      var selectedClientId = null;
      var pollTimer = null;

      fetch('api/auth.php', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'me' })
      }).then(function (r) { return r.json(); }).then(function (res) {
        if (!res || !res.ok) { location.href = 'index.html'; return; }
        el('#userName').textContent = res.user.name;
        el('#userEmail').textContent = res.user.email;
        el('#userAvatar').textContent = (res.user.name || '?').trim().charAt(0).toUpperCase();
        loadClients();
        pollTimer = setInterval(loadClients, 5000);
      }).catch(function () { location.href = 'index.html'; });

      el('#btnLogout').onclick = function () {
        fetch('api/auth.php', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'logout' })
        }).then(function () { location.href = 'index.html'; }).catch(function () { location.href = 'index.html'; });
      };

      function timeAgo(iso) {
        if (!iso) return '';
        var diff = (Date.now() - new Date(iso).getTime()) / 1000;
        if (diff < 60) return 'az önce';
        if (diff < 3600) return Math.floor(diff / 60) + ' dk önce';
        if (diff < 86400) return Math.floor(diff / 3600) + ' sa önce';
        return Math.floor(diff / 86400) + ' gün önce';
      }

      function shortId(id) { return id.length > 13 ? id.slice(0, 8) + '…' : id; }

      function loadClients() {
        fetch('api/cevt.php', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'list_clients' })
        }).then(function (r) { return r.json(); }).then(function (res) {
          if (!res || !res.ok) return;
          renderClientList(res.clients || []);
        }).catch(function () {});
      }

      function renderClientList(clients) {
        el('#clientCount').textContent = clients.length + ' client';
        var list = el('#clientList');

        if (clients.length === 0) {
          list.innerHTML = '<div class="cevt-empty-sidebar">Henüz event gelmedi. SF entegrasyonu aktif olduğunda ilk ziyaretçi burada görünecek.</div>';
          return;
        }

        list.innerHTML = clients.map(function (c) {
          var activeCls = c.client_id === selectedClientId ? ' active' : '';
          var userChip = c.user_id ? '<span class="cevt-client-user">👤 ' + c.user_id + '</span>' : '';
          return (
            '<div class="cevt-client-item' + activeCls + '" data-id="' + c.client_id + '">' +
              '<div class="row1"><span class="cevt-client-id">' + shortId(c.client_id) + '</span>' +
                '<span class="cevt-client-badge">' + c.event_count + '</span></div>' +
              '<div class="cevt-client-meta"><span>' + timeAgo(c.last_seen) + '</span>' + userChip + '</div>' +
            '</div>'
          );
        }).join('');

        Array.prototype.forEach.call(list.querySelectorAll('.cevt-client-item'), function (node) {
          node.onclick = function () { selectClient(node.getAttribute('data-id')); };
        });
      }

      function selectClient(clientId) {
        selectedClientId = clientId;
        Array.prototype.forEach.call(el('#clientList').querySelectorAll('.cevt-client-item'), function (node) {
          node.classList.toggle('active', node.getAttribute('data-id') === clientId);
        });
        loadEvents(clientId);
      }

      function loadEvents(clientId) {
        var main = el('#mainPanel');
        main.innerHTML = '<div class="cevt-placeholder">Yükleniyor…</div>';
        fetch('api/cevt.php', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'get_client', client_id: clientId })
        }).then(function (r) { return r.json(); }).then(function (res) {
          if (!res || !res.ok) { main.innerHTML = '<div class="cevt-placeholder">Yüklenemedi.</div>'; return; }
          renderTimeline(clientId, res.events || []);
        }).catch(function () { main.innerHTML = '<div class="cevt-placeholder">Yüklenemedi.</div>'; });
      }

      function renderTimeline(clientId, events) {
        var main = el('#mainPanel');
        var head =
          '<div class="cevt-main-head"><h2>' + clientId + '</h2>' +
          '<span class="sub">' + events.length + ' olay</span></div>';

        if (events.length === 0) {
          main.innerHTML = head + '<div class="cevt-placeholder"><div class="ic">🕳️</div>Bu client için henüz olay yok.</div>';
          return;
        }

        var items = events.slice().reverse().map(function (ev) {
          var dotCls = ev.source === 'server' ? ' server' : '';
          var extra = '';
          if (ev.page_url) { extra += '<div class="cevt-tl-extra">' + ev.page_url + '</div>'; }
          if (ev.value) { extra += '<div class="cevt-tl-extra"><code>' + JSON.stringify(ev.value) + '</code></div>'; }
          return (
            '<div class="cevt-tl-item"><div class="cevt-tl-dot' + dotCls + '"></div>' +
              '<div class="cevt-tl-body">' +
                '<span class="cevt-tl-name">' + ev.event_name + '</span>' +
                '<span class="cevt-tl-source">' + ev.source + '</span>' +
                '<div class="cevt-tl-time">' + new Date(ev.occurred_at).toLocaleString('tr-TR') + '</div>' +
                extra +
              '</div></div>'
          );
        }).join('');

        main.innerHTML = head + '<div class="cevt-timeline">' + items + '</div>';
      }
    })();
  </script>
</body>
</html>
